name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group test --group lint
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check langchain_sofya tests
          uv run mypy langchain_sofya
      - name: Unit tests (no network)
        run: uv run pytest tests/unit_tests --disable-socket --allow-unix-socket
